{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vulntracker.fullname" . }}-netpol
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vulntracker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Restrict ingress: only traffic destined to port 8000
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      from:
        # Ingress controller namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Allow outbound DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to notification service
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.notifyServicePort }}
{{- end }}
